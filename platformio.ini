[platformio]
default_envs = cardputer
core_dir = .platformio
build_dir = .pio/build
libdeps_dir = .pio/libdeps

[env:cardputer]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
  tool-esptoolpy @ file://tools/pio-esptool
board_upload.flash_size = 8MB
board_upload.maximum_size = 8323072
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DESP32S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DENIGMA_VERSION=\"0.1.0\"
lib_deps =
  m5stack/M5GFX@0.3.0
  m5stack/M5Unified@0.3.0
  arduino-irremote/IRremote@4.7.1
  m5stack/M5Cardputer@1.1.1
  bblanchon/ArduinoJson@7.4.2
